<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingia — Channel API</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a class="brand" href="/"><div class="logo" data-icon="radio"></div><div>Channel API</div></a>
      <h1>Karibu tena</h1>
      <p class="sub">Ingia kwa namba ya simu na password.</p>
      <div id="msg"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="phone">Namba ya simu</label>
          <div class="input-icon" data-icon="phone"><input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="0712 345 678" required></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-icon" data-icon="lock"><input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        </div>
        <button class="btn primary block" type="submit">Ingia</button>
      </form>
      <p class="auth-foot"><a href="/forgot">Umesahau password?</a></p>
      <p class="auth-foot">Huna akaunti? <a href="/register">Jisajili</a></p>
    </div>
  </div>
</body>
</html>
