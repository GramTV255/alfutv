<!doctype html>
<html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Live TV</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/player.css"></head>
<body class="live" data-page="live">
<div class="player-wrap" id="stage">
  <video id="videoPlayer" autoplay playsinline></video>
  <div id="loading">
    <div class="spinner-wrap"><div class="spinner"></div><div class="spinner-icon" id="loadIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div></div>
    <div class="loading-title" id="loadTitle">Inapakia…</div><div class="loading-sub">Tafadhali subiri…</div>
  </div>
  <div class="error-panel" id="errorPanel">
    <div class="err-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <div class="err-title" id="errTitle">Playback Error</div><div class="err-msg" id="errMsg">Video haipatikani kwa sasa.</div>
    <button class="retry-btn" id="retryBtn">🔄 Jaribu Tena</button><div class="err-detail" id="errDetail" style="display:none"></div>
  </div>
  <div id="controlsOverlay">
    <div class="top-bar">
      <button class="back-btn" id="backBtn" aria-label="Rudi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg></button>
      <img id="chLogo" alt="" hidden data-hide>
      <div class="ch-title"><span id="chName">Live TV</span><span class="live-badge" id="liveBadge">● LIVE</span></div>
      <button class="menu-btn" id="menuBtn" aria-label="Channels"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="center-play"><button id="centerPlayBtn" aria-label="Play/Pause">
      <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button></div>
    <div class="bottom-bar">
      <div class="progress-row"><span class="time-text" id="currentTime">00:00</span><input type="range" id="progressBar" min="0" max="100" value="0" step="0.1"><span class="time-text" id="duration">00:00</span></div>
      <div class="controls-row">
        <div class="ctrl-group"><button class="ctrl-btn" id="muteBtn" aria-label="Sauti">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
          <input type="range" id="volumeBar" min="0" max="1" value="1" step="0.1"></div>
        <div class="ctrl-group"><button class="ctrl-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="ctrl-btn" id="fsBtn" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button></div>
      </div>
    </div>
  </div>
  <div class="settings-panel glass" id="settingsPanel"><div class="settings-title">⚙️ Settings</div>
    <div class="settings-section"><div class="settings-label">Resolution</div><div id="qualityLevels"><div class="quality-btn" style="color:#6b7280;font-style:italic">Auto</div></div></div>
    <div class="settings-section"><div class="settings-label">Audio</div><div id="audioTracks"><div class="quality-btn" style="color:#6b7280;font-style:italic">Default</div></div></div></div>
  <div class="dr-shade" id="drShade"></div>
  <aside class="ch-drawer glass" id="chDrawer" aria-hidden="true"><div class="dr-head"><b>Channels</b><button class="dr-x" id="drClose" aria-label="Funga">✕</button></div>
    <input class="dr-q" id="drQ" placeholder="Tafuta channel…" autocomplete="off"><div id="drNote"></div><div class="dr-list" id="drList"></div></aside>
</div>
<script src="/js/ui.js"></script><script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
<script src="/js/player.js"></script>
</body></html>
